<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Website Padel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif}
body{background:#0c1210;color:#eef2ef}
.topbar{position:sticky;top:0;z-index:50;background:#10141a;border-bottom:1px solid #223028;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1rem;white-space:nowrap}
.brand small{font-weight:400;color:#8b988f;margin-left:8px}
.design-nav{display:flex;gap:8px;overflow-x:auto;flex:1;padding-bottom:2px}
.dnav-btn{background:#1a2230;color:#cfd6dd;border:1px solid #2c3a33;padding:9px 18px;border-radius:999px;font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap;font-family:inherit}
.dnav-btn.active{background:#25D366;color:#06281a;border-color:#25D366}
.demo-bar{background:#e8a33d;color:#10121a;text-align:center;font-size:.8rem;font-weight:700;padding:8px 12px}
#stage{width:100%;height:calc(100dvh - 112px);border:0;display:block;background:#F6F8FB}
@media(max-width:640px){
.topbar{padding:8px 10px;gap:8px}
.brand{font-size:.85rem}
.brand small{display:none}
.dnav-btn{padding:7px 13px;font-size:.78rem}
.demo-bar{font-size:.68rem;padding:6px 8px}
#stage{height:calc(100dvh - 96px)}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">🏓 <span id="client-name">Demo Padel</span><small>— pilih desain:</small></div>
  <div class="design-nav" id="design-nav"></div>
</div>
<div class="demo-bar" id="demo-bar">CONTOH DESAIN</div>
<iframe id="stage" title="Preview desain website padel"></iframe>
<script>
// ===== DAFTAR DESAIN — tambah entry baru tiap nemu desain bagus =====
// 1. Simpan file desain sebagai design3.html, design4.html, dst (di folder ini)
// 2. Tambah 1 baris di bawah. Selesai — tombol nav muncul otomatis.
var DESIGNS = [
  {id: 'design1', file: 'design1.html', label: 'Design 1 — Editorial'},
  {id: 'design2', file: 'design2.html', label: 'Design 2 — Sporty'},
  {id: 'design3', file: 'design3.html', label: 'Design 3 — Bold'},
  {id: 'design4', file: 'design4.html', label: 'Design 4 — Classic'}
];
(function(){
  var params = new URLSearchParams(location.search);
  var current = params.get('design') || DESIGNS[0].id;
  if (!DESIGNS.some(function(d){ return d.id === current; })) current = DESIGNS[0].id;
  params.delete('design');
  var qs = params.toString();
  var name = params.get('name') || 'Demo Padel';

  document.title = 'Demo Website — ' + name;
  document.getElementById('client-name').textContent = name;
  document.getElementById('demo-bar').textContent =
    'CONTOH DESAIN — dibuatkan khusus untuk ' + name + ' oleh Dhaby — klik tombol di atas untuk ganti desain, data client tetap sama';

  var nav = document.getElementById('design-nav');
  var stage = document.getElementById('stage');
  function paintActive(){
    Array.prototype.forEach.call(nav.children, function(b){
      b.classList.toggle('active', b.dataset.id === current);
    });
  }
  function loadDesign(id){
    current = id;
    var p2 = new URLSearchParams(location.search);
    p2.set('design', id);
    history.replaceState(null, '', location.pathname + '?' + p2.toString());
    var f = DESIGNS.filter(function(d){ return d.id === id; })[0].file;
    stage.src = f + (qs ? '?' + qs : '');
    paintActive();
  }
  DESIGNS.forEach(function(d){
    var b = document.createElement('button');
    b.className = 'dnav-btn';
    b.dataset.id = d.id;
    b.textContent = d.label;
    b.onclick = function(){ loadDesign(d.id); };
    nav.appendChild(b);
  });
  loadDesign(current);
})();
</script>
</body>
</html>
